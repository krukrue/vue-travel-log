name: Lint

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - run: pnpm install
      - run: pnpm lint
